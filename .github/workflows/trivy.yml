name: BFlow Frontend Trivy

# Standalone workflow so the README badge reflects the state of `main`.
# Also reusable from ci.yml so every pull request is scanned.
on:
  workflow_call:
  push:
    branches:
      - main
      - develop
  schedule:
    # Weekly: new CVEs are published against unchanged lockfiles.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Actions are pinned to full commit SHAs: in March 2026 most mutable
      # tags of aquasecurity/trivy-action were force-pushed to malicious
      # commits. 0.35.0 is a known-good release.
      - name: Trivy scan (SARIF for Code Scanning)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: table
          exit-code: "1"
